name: CI

on:
  push:
    branches: [main, 'sprint/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:seed
      # Plan bullets vs the backend's tenants/plans.py, through the checked-in
      # snapshot (tests/contract/plans-snapshot.json). --verify-snapshot
      # compares the snapshot with the backend file when SHIRIKI_BACKEND_REPO
      # points at a checkout; without one it reports "skip" and passes.
      - run: pnpm test:contract
      - run: pnpm exec tsx scripts/check-plans-contract.ts --verify-snapshot
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts builds and serves the production app itself
      # (webServer: pnpm build && pnpm start), so there is no separate build step.
      # Visual baselines are Linux screenshots (tests/visual.spec.ts-snapshots/*-linux.png).
      - run: pnpm exec playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

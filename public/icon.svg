<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shiriki">
  <title>Shiriki</title>
  <!--
    The S is two arcs of equal radius facing opposite ways: the upper one
    opens to receive, the lower one turns back out to give. "Shiriki" is
    Swahili for to share or take part, and the letterform already contains
    that gesture — it only needed the two halves separated by colour.
    Stroked rather than set in a typeface so it holds its weight at 16px.
  -->
  <rect width="64" height="64" rx="14" fill="#008194" />
  <path d="M42 22 A10 10 0 1 0 32 32" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M32 32 A10 10 0 1 1 22 42" stroke="#7ee8f0" stroke-width="7" stroke-linecap="round" fill="none" />
</svg>
